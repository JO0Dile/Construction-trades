name: CI

# Runs on every branch, not just main: the debug APK this produces is how the
# app gets onto a phone before there is a Play listing, so it has to be built
# on whichever branch the work is happening on.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # The generated Android and iOS resource files must match the shared
      # catalogue. This fails if someone hand-edited a strings.xml, or added a
      # string in one language and forgot the other two.
      - name: Translations are complete and generated files are current
        run: python3 tools/gen-strings.py --check

      # A Room annotation binds to whatever function follows it. Slip a KDoc
      # between the two and the query lands on the next method instead, which
      # is how a lookup by ID number came to declare it returned COUNT(*).
      # Both halves of that mistake fail KSP; this catches them in a second
      # instead of forty.
      - name: Every DAO method carries exactly one Room annotation
        run: python3 tools/check-dao.py

      # The change feed is filtered by lens, and a kind of record nobody has
      # classified is shown to nobody. That is the safe direction and a silent
      # one: a new register would simply never appear in anybody's feed, and
      # nobody would find out for a release or two.
      - name: Every audited kind of change is classified by lens
        run: python3 tools/check-audit-lens.py

      # Parses every catalogue file through the app's own model types with
      # unknown keys rejected, and runs the locale, format, time-of-day and
      # CSV tests. Needs no emulator.
      - name: Unit tests
        working-directory: android
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Lint
        working-directory: android
        run: ./gradlew --no-daemon :app:lintDebug

      # A migration whose CREATE TABLE differs from the entity compiles, lints
      # and passes the unit tests, then crashes on launch for everyone who
      # already has the app. Nothing else in this pipeline catches it.
      - name: Migration SQL matches the schema Room expects
        run: python3 tools/check-migration.py

      # The check above compares two pieces of text and cannot see an INSERT
      # at all. SQLite will not loosen a NOT NULL in place, so changing one
      # means rebuilding the table and copying the rows across — and a copy
      # that misses a column leaves the schema perfect and the data gone.
      - name: The migrations run, and no rebuild loses its rows
        run: python3 tools/run-migrations.py

      # A repository method nothing calls is how this app shipped with no way
      # to report an accident: the table, the DAO and the repository were all
      # there and no screen could reach any of them. Four features had been
      # described by a name and a comment and performed by nothing. This holds
      # the count where the last review left it.
      - name: No new unreachable code in core and repositories
        run: python3 tools/find-unused.py --check

      - name: No new arguments that are only ever passed null
        run: python3 tools/check-null-args.py --check

      # The release build had never been run. Only assembleDebug was, and
      # debug does not minify — so R8 stripping something Room, SQLCipher or
      # kotlinx.serialization loads reflectively would have surfaced for the
      # first time on the day of a store submission. This is the bundle Google
      # Play actually takes, built the way Play takes it, on every push.
      # Unsigned here: no upload key exists on CI, and signing is the last
      # step before upload rather than a prerequisite for knowing it builds.
      - name: Release bundle builds and survives R8
        run: ./gradlew --no-daemon :app:bundleRelease
        working-directory: android

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug

      # This artifact is the app. See docs/TESTING.md.
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: trades-work-manager-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
